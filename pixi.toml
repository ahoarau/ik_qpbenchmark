[workspace]
name = "ik_qpbenchmark"
channels = ["https://conda.anaconda.org/conda-forge", "https://conda.anaconda.org/gurobi"]
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
run = "qpbenchmark ./ik_qpbenchmark.py run"

[dependencies]
clarabel = ">=0.4.1"
cvxopt = ">=1.3.0"
daqp = ">=0.5.1"
ecos = ">=2.0.10"
gurobi = ">=11.0.3"
ipython = "*"
kvxopt = "*"
matplotlib = "*"
numpy = ">=1.25.2"
osqp = ">=0.6.2"
piqp = ">=0.2.2"
proxsuite = ">=0.4.1"
qpbenchmark = ">=2.4.0"
qpoases = ">=3.2.0"
quadprog = ">=0.1.11"
scs = ">=3.2.2"

[pypi-dependencies]
highspy = ">=1.5.2"
qpalm = ">=1.2.1"
